name: CI

# Runs on every pull request and on pushes to the main branch.
#
# This workflow deliberately needs no repository secrets, so it works on a fresh
# clone. It verifies the things that must never regress: the code compiles, the
# types are sound, the linter is clean, and the production build succeeds.
#
# Anything that needs a real database lives in the "Integration" job below, which
# skips itself when secrets are not configured.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run, so feedback stays current
# and minutes are not wasted on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholder values so a build can run without secrets.
  #
  # The publishable key is public by design; it identifies the project and grants no
  # data access, because RLS is enabled on every table with no policy for `anon`.
  # These are only ever used to render and type-check the app, never to read data.
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  # Non-empty dummies: the server secret getters validate presence when called, and
  # the build never calls them because it serves no user request.
  SUPABASE_JWT_SECRET: ci-placeholder-not-a-real-secret
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-secret

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 rather than 22: the lockfile is generated by a newer npm, and an
          # older npm bundled with Node 22 can refuse it in `npm ci`.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Catches a broken workflow definition in the pull request that breaks it,
      # rather than after it lands on the main branch.
      - name: Validate CI configuration
        run: npm run validate:ci

      - name: Build
        run: npm run build

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Lint, typecheck and build passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Quality checks failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Run \`npm run lint && npm run typecheck && npm run build\` locally to reproduce." >> "$GITHUB_STEP_SUMMARY"
          fi

  integration:
    name: Database and HTTP integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # These tests create rows, so they need a real project. They are skipped rather
    # than failed when the secrets are absent, which keeps the workflow green on a
    # fork or a fresh clone while still running wherever it is configured.
    #
    # To enable, add these repository secrets:
    #   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_JWT_SECRET,
    #   SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL
    # Point them at a throwaway project, never at the family's live database.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Check whether integration secrets are configured
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Integration secrets found; the suite will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ Integration tests skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the DATABASE_URL repository secret (plus the other five) to enable them." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      # The test scripts read .env.local, so write it from secrets rather than
      # threading the values through process arguments.
      - name: Write .env.local from secrets
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
          SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          DATABASE_URL=${DATABASE_URL}
          EOF
          echo "Wrote .env.local from repository secrets."

      # Proves the migrations are applyable from scratch, which is what a new
      # deployment relies on.
      - name: Apply migrations
        if: steps.check.outputs.configured == 'true'
        run: npm run db:migrate

      - name: Business logic tests
        if: steps.check.outputs.configured == 'true'
        run: npm run test:db

      - name: Start the server
        if: steps.check.outputs.configured == 'true'
        run: |
          npm run build
          npm start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "Server is up."
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time."
          exit 1

      - name: HTTP end-to-end tests
        if: steps.check.outputs.configured == 'true'
        run: npm run test:e2e

      - name: Leave the test project clean
        if: always() && steps.check.outputs.configured == 'true'
        run: node scripts/cleanup-fixtures.mjs

name: CI

# Runs on every pull request and on pushes to the main branch.
#
# Two jobs:
#   quality      - lint, typecheck, validate the CI config, build. Needs no secrets, so it
#                  runs on a fresh clone and is the check branch protection requires.
#   integration  - the database and HTTP suites. Creates rows, so it needs a real project
#                  and points at one through secrets.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run, so feedback stays current and
# minutes are not wasted on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholder values so a build can run without secrets.
    #
    # Scoped to this job, not the workflow, and that scoping is load-bearing. Next.js
    # prefers a variable that is already in the process environment over the same key in
    # `.env.local`, so a workflow-level `SUPABASE_JWT_SECRET` here would follow the
    # integration job around and quietly win over the value that job wrote into
    # `.env.local`. It did: the app verified session cookies with
    # "ci-placeholder-not-a-real-secret" while the suites minted them with the local
    # stack's secret, so every authenticated request was rejected and the suites reported
    # a wall of `307 -> /login` that said nothing about the cause.
    #
    # `NEXT_PUBLIC_*` is worse than that, because it is inlined into the bundle at build
    # time: a placeholder there means the built app talks to example.supabase.co forever.
    env:
      # The publishable key is public by design; it identifies the project and grants no
      # data access, because RLS is enabled on every table with no policy for `anon`. These
      # are only ever used to render and type-check the app, never to read data.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      # Non-empty dummies: the server secret getters validate presence when called, and the
      # build never calls them because it serves no user request.
      SUPABASE_JWT_SECRET: ci-placeholder-not-a-real-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 rather than 22: the lockfile is generated by a newer npm, and an older
          # npm bundled with Node 22 can refuse it in `npm ci`.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The unit suites need no secrets, so they belong here rather than in the
      # integration job. This runs the CI configuration check (which catches a broken
      # workflow definition in the pull request that breaks it, rather than after it
      # lands on the main branch) plus the pure-logic suites. `--no-db` makes the
      # runner stop after those instead of reaching for .env.local.
      - name: Unit suites
        run: npm run test:all -- --no-db

      - name: Build
        run: npm run build

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Lint, typecheck and build passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Quality checks failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Run \`npm run lint && npm run typecheck && npm run build\` locally to reproduce." >> "$GITHUB_STEP_SUMMARY"
          fi

  integration:
    name: Database and HTTP integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # These suites create and delete rows and files, and they need a reachable database.
    #
    # Two ways to get one, decided in the first step:
    #   * the five repository secrets, pointing at a THROWAWAY project. Use this if you
    #     have one: it is closest to production;
    #   * otherwise a Supabase stack started locally in Docker. This is the default, and it
    #     is why the suites actually run on every pull request instead of being skipped.
    #     Before it existed, `configured=false` skipped the whole job, so the checks went
    #     green having run nothing but lint and the unit suites.
    #
    # The secrets path is safer for data, not more correct: the local stack is thrown away
    # with the runner, so nothing can be left behind in a real project.
    #
    # Point the secrets at a project used for nothing else. These suites create families,
    # children and files, and a failure mid-run can leave rows behind.
    #
    #   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_JWT_SECRET,
    #   SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Decide which database the suites will run against
        id: target
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "mode=secrets" >> "$GITHUB_OUTPUT"
            echo "Integration secrets found: the suites will run against that project." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "No integration secrets: starting a local Supabase so the suites still run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Supabase CLI
        if: steps.target.outputs.mode == 'local'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Started only when there are no secrets. `-x` leaves out the services the suites
      # never touch: pulling Studio, the log pipeline, Realtime and Supavisor costs minutes
      # and buys nothing here.
      #
      # Not the family's project, and not a shared one either - the whole stack lives and
      # dies with the runner, so a suite that fails halfway cannot leave a row or an image
      # behind in a database somebody actually uses.
      - name: Start a local Supabase
        if: steps.target.outputs.mode == 'local'
        run: |
          supabase init
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      # The suites read .env.local, so write it from secrets rather than threading the
      # values through process arguments where they would show up in the logs.
      - name: Write .env.local from secrets
        if: steps.target.outputs.mode == 'secrets'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
          SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          DATABASE_URL=${DATABASE_URL}
          EOF
          echo "Wrote .env.local from repository secrets."

      # The same five values, read back from the stack that was just started. `ANON_KEY` is
      # the local publishable key: a JWT rather than an `sb_publishable_...` string, which
      # `lib/env.ts` accepts - it checks that the value is present, not what it looks like.
      #
      # Written twice on purpose: `.env.local` is what the suites read, and `$GITHUB_ENV` is
      # what the Next.js server the suites start will see. Next prefers a variable already
      # in the process environment over the same key in `.env.local`, so exporting only the
      # file would leave the app and the suites able to disagree about the JWT secret - and
      # the symptom of that is every session cookie being rejected, with nothing in the log
      # pointing at the cause.
      #
      # The local database has no TLS at all, which is why every suite asks
      # `scripts/lib/database-ssl.mjs` rather than hardcoding `ssl: {...}`.
      - name: Write .env.local for the local stack
        if: steps.target.outputs.mode == 'local'
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${API_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}
          SUPABASE_JWT_SECRET=${JWT_SECRET}
          SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
          DATABASE_URL=${DB_URL}
          EOF
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "SUPABASE_JWT_SECRET=${JWT_SECRET}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
          echo "Wrote .env.local and the job environment for the local stack at ${API_URL}."

      # Proves the migrations apply from scratch, which is what a new deployment relies on.
      # `npm run test:all` below runs migrations again; that is harmless because the runner
      # skips files it has already applied, and it also covers the case where the secrets
      # arrive without this step having run.
      - name: Verify migrations apply from scratch
        run: npm run db:migrate

      # Playwright drives a browser and needs one to exist. This repository installs
      # `playwright-core`, which deliberately downloads no browser of its own and whose
      # CLI is `playwright-core` - not `playwright`, which would be a second copy of the
      # library at a version that need not match this one. Locally the UI suite uses the
      # Edge or Chrome already on the machine and nothing is downloaded here at all.
      #
      # Without this step the UI suite fails on a runner with no branded browser - and it
      # fails loudly rather than skipping, because a UI suite that silently does not run is
      # worse than no UI suite: it reports a green build that verified nothing.
      - name: Install the browser for the UI suite
        run: npx playwright-core install --with-deps chromium

      # One command for every database-backed suite, with a summary table. Each suite is
      # still runnable on its own while working on one area. The browser UI suite is in
      # here too: it runs last, it reuses the build the HTTP suite has just made, and it
      # fails this job when a UI change breaks a screen, which is the whole point of it.
      - name: Database and browser suites
        run: npm run test:all

      - name: Report the failure, if any
        if: failure()
        run: |
          echo "### ❌ A suite failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally with \`npm run test:all\` and read the SUMMARY table above" >> "$GITHUB_STEP_SUMMARY"
          echo "for which suite failed." >> "$GITHUB_STEP_SUMMARY"

      # The HTTP suite starts its own server, so nothing is left listening afterwards.
      # This still runs on failure, to remove rows an interrupted suite may have left.
      - name: Leave the test project clean
        if: always()
        run: node scripts/cleanup-fixtures.mjs --apply

name: CI

# Runs on every pull request and on pushes to the main branch.
#
# Two jobs:
#   quality      - lint, typecheck, validate the CI config, build. Needs no secrets, so it
#                  runs on a fresh clone and is the check branch protection requires.
#   integration  - the database and HTTP suites. Creates rows, so it needs a real project
#                  and points at one through secrets.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run, so feedback stays current and
# minutes are not wasted on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholder values so a build can run without secrets.
  #
  # The publishable key is public by design; it identifies the project and grants no data
  # access, because RLS is enabled on every table with no policy for `anon`. These are only
  # ever used to render and type-check the app, never to read data.
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  # Non-empty dummies: the server secret getters validate presence when called, and the
  # build never calls them because it serves no user request.
  SUPABASE_JWT_SECRET: ci-placeholder-not-a-real-secret
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-secret

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 rather than 22: the lockfile is generated by a newer npm, and an older
          # npm bundled with Node 22 can refuse it in `npm ci`.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Catches a broken workflow definition in the pull request that breaks it, rather
      # than after it lands on the main branch.
      - name: Validate CI configuration
        run: npm run validate:ci

      - name: Build
        run: npm run build

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Lint, typecheck and build passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Quality checks failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Run \`npm run lint && npm run typecheck && npm run build\` locally to reproduce." >> "$GITHUB_STEP_SUMMARY"
          fi

  integration:
    name: Database and HTTP integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # These suites create and delete rows, so they need a real project. They are skipped
    # rather than failed when the secrets are absent, which keeps the workflow green on a
    # fork or a fresh clone while still running wherever it is configured.
    #
    # On a pull request they run only when the repository is configured for it. Point the
    # secrets at a THROWAWAY project: these suites create families, children and files,
    # and while they clean up after themselves, a failure mid-run can leave rows behind.
    # Against the family's live database that is a risk worth avoiding.
    #
    # To enable, add these repository secrets:
    #   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_JWT_SECRET,
    #   SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Check whether integration secrets are configured
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Integration secrets found; the suites will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ Integration tests skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the DATABASE_URL repository secret (plus the other four) to enable them." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      # The suites read .env.local, so write it from secrets rather than threading the
      # values through process arguments where they would show up in the logs.
      - name: Write .env.local from secrets
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
          SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          DATABASE_URL=${DATABASE_URL}
          EOF
          echo "Wrote .env.local from repository secrets."

      # Proves the migrations apply from scratch, which is what a new deployment relies on.
      # `npm run test:all --quick` below runs migrations again; that is harmless because
      # the runner skips files it has already applied, and it also covers the case where
      # the secrets arrive without this step having run.
      - name: Verify migrations apply from scratch
        if: steps.check.outputs.configured == 'true'
        run: npm run db:migrate

      # One command for every database-backed suite, with a summary table. Each suite is
      # still runnable on its own while working on one area.
      - name: Database suites
        if: steps.check.outputs.configured == 'true'
        run: npm run test:all

      - name: Report the failure, if any
        if: failure() && steps.check.outputs.configured == 'true'
        run: |
          echo "### ❌ A suite failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally with \`npm run test:all\` and read the SUMMARY table above" >> "$GITHUB_STEP_SUMMARY"
          echo "for which suite failed." >> "$GITHUB_STEP_SUMMARY"

      # The HTTP suite starts its own server, so nothing is left listening afterwards.
      # This still runs on failure, to remove rows an interrupted suite may have left.
      - name: Leave the test project clean
        if: always() && steps.check.outputs.configured == 'true'
        run: node scripts/cleanup-fixtures.mjs --apply
